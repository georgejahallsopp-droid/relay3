name: Build Relay.exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the source files
        id: find
        shell: pwsh
        run: |
          $src = Get-ChildItem -Recurse -File -Filter Relay.cs | Select-Object -First 1
          if (-not $src) {
            Write-Host "Files in this repository:"
            Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '\\.git\\' } | ForEach-Object { Write-Host "  $($_.FullName)" }
            throw "Relay.cs isn't in this repository. Upload Relay.cs, index.html and How to use.txt with Add file > Upload files."
          }
          $dir = $src.DirectoryName
          if (-not (Test-Path (Join-Path $dir "index.html"))) {
            throw "index.html must be in the same folder as Relay.cs ($dir)."
          }
          Write-Host "Building from $dir"
          "dir=$dir" >> $env:GITHUB_OUTPUT

      - name: Compile
        shell: pwsh
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) { throw "csc.exe not found at $csc" }
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          & $csc /nologo /target:exe /optimize+ "/out:$env:GITHUB_WORKSPACE\dist\Relay.exe" `
            /r:System.Web.Extensions.dll `
            /resource:index.html,Relay.index.html `
            Relay.cs
          if ($LASTEXITCODE -ne 0) { throw "Compile failed. Send the error lines above to Claude." }
          if (Test-Path "How to use.txt") { Copy-Item "How to use.txt" "$env:GITHUB_WORKSPACE\dist\" }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Relay-windows
          path: dist/

      - name: Publish release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/* -DestinationPath Relay-windows.zip -Force
          gh release create "${{ github.ref_name }}" Relay-windows.zip --title "Relay ${{ github.ref_name }}" --generate-notes
